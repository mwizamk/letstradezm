<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Let's Trade ZM</title>
    <style>
        :root {
            --navy: #0a192f;
            --cream: #fffdfa;
            --black: #0f172a;
            --gold: #f59e0b;
            --border: rgba(255, 255, 255, 0.15);
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: linear-gradient(rgba(10, 25, 47, 0.9), rgba(10, 25, 47, 0.95)), url('assets/images/image_4.png') no-repeat center center fixed; 
            background-size: cover; 
            color: var(--cream); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 15px; 
        }
        .container { width: 100%; max-width: 400px; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border); border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); padding: 30px; backdrop-filter: blur(12px); }
        .brand-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .logo-badge { width: 42px; height: 42px; background: var(--cream); border: 2px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .logo-badge img { width: 100%; height: 100%; object-fit: cover; }
        h2 { margin-bottom: 5px; font-size: 1.4rem; color: var(--cream); text-align: center; }
        .sub-text { text-align: center; color: #94a3b8; font-size: 0.8rem; margin-bottom: 20px; }
        .error-message { background: rgba(239, 68, 68, 0.2); color: #fca5a5; padding: 10px; border-radius: 10px; margin-bottom: 15px; font-size: 0.85rem; display: none; text-align: center; border: 1px solid var(--danger); }
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: var(--cream); }
        .input-group input { width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 1rem; outline: none; background: rgba(255,255,255,0.05); color: var(--cream); }
        .input-group input:focus { border-color: var(--gold); background: rgba(255,255,255,0.1); }
        .btn { padding: 14px 24px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; width: 100%; background: var(--gold); color: var(--black); transition: 0.2s; box-shadow: 0 4px 15px rgba(245,158,11,0.3); }
        .btn:hover { background: #d97706; color: white; }
        .info-box { margin-top: 18px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; padding: 10px; font-size: 0.75rem; color: #94a3b8; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <div class="brand-header">
        <div class="logo-badge"><img src="assets/images/image_7.png" alt="Logo"></div>
        <div><div style="font-weight:700;">Let's Trade ZM</div><div style="font-size:0.75rem; color:#94a3b8;">Admin Authorization</div></div>
    </div>

    <h2>Admin Portal Login</h2>
    <p class="sub-text">Password can be changed anytime in Dashboard > Settings</p>
    <div class="error-message" id="loginError">Invalid username or password.</div>

    <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
        <div class="input-group">
            <label for="adminUsername">Username</label>
            <input type="text" id="adminUsername" required placeholder="admin" value="admin">
        </div>
        <div class="input-group">
            <label for="adminPassword">Password</label>
            <input type="password" id="adminPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn">LOGIN</button>
    </form>

    <div class="info-box">
        Default: <b>admin / password123</b><br>
        After you change it in Settings, use new one here.
    </div>
</div>

<script>
    // SET DEFAULTS IF FIRST TIME
    if (!localStorage.getItem('zm_admin_user')) {
        localStorage.setItem('zm_admin_user', 'admin');
    }
    if (!localStorage.getItem('zm_admin_pass')) {
        localStorage.setItem('zm_admin_pass', 'password123');
    }

    function handleAdminLogin(event) {
        event.preventDefault();
        const user = document.getElementById('adminUsername').value.trim();
        const pass = document.getElementById('adminPassword').value.trim();
        const savedUser = localStorage.getItem('zm_admin_user') || 'admin';
        const savedPass = localStorage.getItem('zm_admin_pass') || 'password123';
        const errorBox = document.getElementById('loginError');

        if (user === savedUser && pass === savedPass) {
            localStorage.setItem('zm_admin_auth', 'true');
            window.location.href = 'admin_dashboard.html';
        } else {
            errorBox.style.display = 'block';
            errorBox.textContent = `Invalid login. Hint: saved user is "${savedUser}"`;
            document.getElementById('adminPassword').value = '';
        }
    }
</script>
</body>
</html>
