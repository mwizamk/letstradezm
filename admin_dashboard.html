<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Let's Trade ZM</title>
<style>
:root{--gold:#f59e0b;--border:rgba(255,255,255,0.15);--danger:#ef4444;--success:#10b981}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#0a192f;color:#fffdfa;padding:10px;display:flex;justify-content:center;min-height:100vh}
.mobile-container{width:100%;max-width:500px;background:rgba(15,23,42,0.95);border:1px solid var(--border);border-radius:28px;display:flex;flex-direction:column;height:97vh;overflow:hidden}
header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.logout-btn{background:rgba(239,68,68,0.2);border:1px solid var(--danger);color:#fca5a5;padding:6px 14px;border-radius:10px;cursor:pointer;font-weight:700}
.tab-nav{display:flex;background:rgba(255,255,255,0.04);padding:4px;gap:4px;overflow-x:auto;white-space:nowrap}
.tab-btn{flex:1;min-width:70px;padding:9px;border:none;background:transparent;color:#94a3b8;font-weight:700;font-size:0.78rem;cursor:pointer;border-radius:10px}
.tab-btn.active{background:rgba(255,255,255,0.1);color:white;border:2px solid var(--gold)}
.tab-content{flex:1;overflow-y:auto;padding:14px}
.tab-pane{display:none}.tab-pane.active{display:block}
.card-item{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
.btn-sm{padding:7px 11px;background:var(--gold);color:#0f172a;border:none;border-radius:9px;font-weight:700;font-size:0.78rem;cursor:pointer}
.form-box{background:rgba(255,255,255,0.04);border:1px solid var(--gold);border-radius:14px;padding:12px;margin-bottom:14px}
.form-box input, .form-box select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:white;margin-bottom:8px;font-size:0.85rem}
.form-box label{font-size:0.72rem;color:#94a3b8;font-weight:600;display:block;margin-bottom:2px}
.badge{font-size:0.65rem;padding:2px 7px;border-radius:6px;font-weight:700}
.badge-active{background:#d1fae5;color:var(--success)}
table{width:100%;border-collapse:collapse;font-size:0.78rem}
th{color:#94a3b8;text-align:left;padding:6px;border-bottom:1px solid var(--border);font-size:0.7rem}
td{padding:6px;border-bottom:1px solid rgba(255,255,255,0.05);word-break:break-all}
</style>
</head>
<body>
<div class="mobile-container">
<header><h2>Admin Portal</h2><button class="logout-btn" onclick="logoutAdmin()">Logout</button></header>
<div class="tab-nav">
<button class="tab-btn active" onclick="switchTab(0)">Clients</button>
<button class="tab-btn" onclick="switchTab(1)">Catalogs</button>
<button class="tab-btn" onclick="switchTab(2)">Accounts</button>
<button class="tab-btn" onclick="switchTab(3)">Analytics</button>
<button class="tab-btn" onclick="switchTab(4)">Settings</button>
</div>
<div class="tab-content">
<div class="tab-pane active" id="tab-clients"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><h3>Clients</h3><button class="btn-sm" onclick="openAddClientModal()">+ Add Client</button></div><div id="adminClientsList"></div></div>

<div class="tab-pane" id="tab-catalogs">
<div class="form-box"><h4 style="color:var(--gold);margin-bottom:6px">➕ Add Live Product</h4>
<label>Title</label><input id="pTitle" placeholder="Netflix | mobile | private">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div><label>Price K</label><input id="pPrice" type="number"></div><div><label>Location</label><input id="pLocation"></div></div>
<button class="btn-sm" style="width:100%" onclick="addFirestoreProduct()">Add to Live</button><div id="catMsg" style="font-size:0.75rem;margin-top:6px;text-align:center"></div></div>
<div id="adminCatalogList"></div></div>

<div class="tab-pane" id="tab-accounts">
<div class="form-box"><h4 style="color:var(--gold);margin-bottom:6px">➕ Add Account (Netflix, etc.)</h4>
<label>Title (Netflix Premium)</label><input id="aTitle" placeholder="Netflix | mobile | private account">
<label>Email / User</label><input id="aEmail" placeholder="email or username">
<label>Password</label><input id="aPassword" placeholder="password">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div><label>User / Profile</label><input id="aUser" placeholder="Profile 1"></div><div><label>Pincode</label><input id="aPincode" placeholder="1234"></div></div>
<button class="btn-sm" style="width:100%" onclick="addAccount()">Save Account</button><div id="accMsg" style="font-size:0.75rem;margin-top:6px;text-align:center"></div></div>
<div id="accountsList"></div>
</div>

<div class="tab-pane" id="tab-analytics"><h3>Metrics</h3><div id="analyticsBox"></div><a href="index.html" target="_blank" style="color:var(--gold);display:block;text-align:center;margin-top:10px">View Live Site →</a></div>

<div class="tab-pane" id="tab-settings">
<div class="form-box"><h4 style="color:var(--gold);margin-bottom:8px">🔑 Change Admin Password At Will</h4>
<label>Current Username</label><input id="sCurUser" disabled>
<label>New Username</label><input id="sNewUser" placeholder="admin">
<label>New Password</label><input id="sNewPass" type="password" placeholder="New password">
<label>Confirm Password</label><input id="sConfPass" type="password" placeholder="Confirm">
<button class="btn-sm" style="width:100%;margin-top:6px" onclick="changeAdminCreds()">Update Password</button>
<div id="setMsg" style="font-size:0.78rem;margin-top:8px;text-align:center"></div>
<p style="font-size:0.7rem;color:#94a3b8;margin-top:10px">Saved on this device. Use new login next time at /admin.html. No code change needed.</p></div>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, deleteDoc, updateDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBxT9skydXjXtJCvyrMelRz2oi6kuMIFu4",authDomain:"letstradezm-e6e7e.firebaseapp.com",projectId:"letstradezm-e6e7e",storageBucket:"letstradezm-e6e7e.firebasestorage.app",messagingSenderId:"689839607726",appId:"1:689839607726:web:56e78f3ca78c0f754e823f"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
if(localStorage.getItem('zm_admin_auth')!=='true'){window.location.href='admin.html';}

window.switchTab=(i)=>{document.querySelectorAll('.tab-btn').forEach((b,idx)=>b.classList.toggle('active',idx===i));document.querySelectorAll('.tab-pane').forEach((p,idx)=>p.classList.toggle('active',idx===i));if(i==0)loadClients();if(i==1)loadCatalogs();if(i==2)loadAccounts();if(i==3)loadAnalytics();if(i==4)loadSettings();};

// CLIENTS (localStorage)
function initDB(){if(!localStorage.getItem('zm_clients_db')){localStorage.setItem('zm_clients_db',JSON.stringify([{name:"Alice Banda",phone:"0971234567",email:"alice@gmail.com",status:"Active",subscriptions:[{service:"Netflix Premium",price:65,status:"Active"}]}]));}}
initDB();
window.loadClients=()=>{const cs=JSON.parse(localStorage.getItem('zm_clients_db'))||[];document.getElementById('adminClientsList').innerHTML=cs.map(c=>`<div class="card-item"><b>${c.name}</b> <span class="badge badge-active">Active</span><br><small>${c.phone} | ${c.email}</small></div>`).join('')||'No clients';};
window.openAddClientModal=()=>{const n=prompt("Name");if(!n)return;let cs=JSON.parse(localStorage.getItem('zm_clients_db'))||[];cs.push({name:n,phone:prompt("Phone")||'',email:prompt("Email")||'',status:"Active",subscriptions:[]});localStorage.setItem('zm_clients_db',JSON.stringify(cs));loadClients();};

// CATALOGS (Firestore products)
window.loadCatalogs=async()=>{const el=document.getElementById('adminCatalogList');try{const snap=await getDocs(collection(db,"products"));el.innerHTML='';snap.forEach(d=>{const p=d.data();el.innerHTML+=`<div class="card-item" style="display:flex;justify-content:space-between"><div><b>${p.title}</b><br><span style="color:var(--gold)">K${p.price}</span> ${p.location||''}</div><button class="btn-sm" style="background:#fee2e2;color:#ef4444" onclick="delProduct('${d.id}')">Del</button></div>`;});}catch(e){el.innerHTML=e.message;}};
window.addFirestoreProduct=async()=>{const t=document.getElementById('pTitle').value,pr=Number(document.getElementById('pPrice').value);if(!t||!pr){document.getElementById('catMsg').textContent='Title + price needed';return;}try{await addDoc(collection(db,"products"),{title:t,price:pr,location:document.getElementById('pLocation').value||'mobile',currency:"ZMW",status:"available",createdAt:serverTimestamp()});document.getElementById('catMsg').textContent='✅ Added!';loadCatalogs();}catch(e){document.getElementById('catMsg').textContent=e.message;}};
window.delProduct=async(id)=>{if(confirm("Delete?")){await deleteDoc(doc(db,"products",id));loadCatalogs();}};

// ACCOUNTS (Firestore accounts table)
window.loadAccounts=async()=>{const el=document.getElementById('accountsList');try{const snap=await getDocs(collection(db,"accounts"));let html='<table><tr><th>Title</th><th>Email/User</th><th>Pass</th><th>User/Pin</th><th>Action</th></tr>';snap.forEach(d=>{const a=d.data();html+=`<tr><td>${a.title||''}</td><td>${a.email||''}</td><td>${a.password||''}</td><td>${a.user||''} / ${a.pincode||''}</td><td><button class="btn-sm" style="padding:3px 6px" onclick="editAccount('${d.id}','${(a.title||'').replace(/'/g,"")}','${(a.email||'').replace(/'/g,"")}','${(a.password||'').replace(/'/g,"")}','${(a.user||'').replace(/'/g,"")}','${(a.pincode||'').replace(/'/g,"")}')">Edit</button> <button class="btn-sm" style="background:#fee2e2;color:#ef4444;padding:3px 6px" onclick="delAccount('${d.id}')">X</button></td></tr>`;});html+='</table>';el.innerHTML=html||'No accounts';}catch(e){el.innerHTML=e.message;}};
window.addAccount=async()=>{const data={title:document.getElementById('aTitle').value.trim(),email:document.getElementById('aEmail').value.trim(),password:document.getElementById('aPassword').value.trim(),user:document.getElementById('aUser').value.trim(),pincode:document.getElementById('aPincode').value.trim(),createdAt:serverTimestamp()};if(!data.title||!data.email){document.getElementById('accMsg').textContent='Title and Email required';return;}try{await addDoc(collection(db,"accounts"),data);document.getElementById('accMsg').textContent='✅ Saved';loadAccounts();}catch(e){document.getElementById('accMsg').textContent=e.message;}};
window.delAccount=async(id)=>{if(confirm("Delete account?")){await deleteDoc(doc(db,"accounts",id));loadAccounts();}};
window.editAccount=async(id,t,e,p,u,pc)=>{const nt=prompt("Title:",t);if(nt===null)return;const ne=prompt("Email/User:",e);if(ne===null)return;const np=prompt("Password:",p);if(np===null)return;const nu=prompt("User/Profile:",u);if(nu===null)return;const npi=prompt("Pincode:",pc);if(npi===null)return;try{await updateDoc(doc(db,"accounts",id),{title:nt,email:ne,password:np,user:nu,pincode:npi});loadAccounts();}catch(err){alert(err.message);}};

// ANALYTICS & SETTINGS
window.loadAnalytics=()=>{document.getElementById('analyticsBox').innerHTML=`Clients: ${JSON.parse(localStorage.getItem('zm_clients_db')||'[]').length}`;loadCatalogs();};
window.loadSettings=()=>{document.getElementById('sCurUser').value=localStorage.getItem('zm_admin_user')||'admin';};
window.changeAdminCreds=()=>{const nu=document.getElementById('sNewUser').value.trim();const np=document.getElementById('sNewPass').value.trim();const cp=document.getElementById('sConfPass').value.trim();const msg=document.getElementById('setMsg');if(!nu||!np){msg.style.color='#fca5a5';msg.textContent='Username and password required';return;}if(np!==cp){msg.style.color='#fca5a5';msg.textContent='Passwords do not match';return;}localStorage.setItem('zm_admin_user',nu);localStorage.setItem('zm_admin_pass',np);msg.style.color='#22c55e';msg.textContent=`✅ Updated! New login: ${nu} / ${np}`;document.getElementById('sCurUser').value=nu;};
window.logoutAdmin=()=>{localStorage.removeItem('zm_admin_auth');window.location.href='admin.html';};
loadClients();
</script>
</body>
</html>
